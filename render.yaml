services:
  - type: web
    name: sales-campaign-generator
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sales-campaign-db
          property: connectionString
      - key: NODE_VERSION
        value: 20
      - key: REGION_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: sales-campaign-db
    plan: free
    databaseName: sales_campaign
    user: sales_campaign
